<div class="min-h-screen flex items-center justify-center bg-[#f8fafc] font-sans p-4">
  
  <div class="w-full max-w-[1000px] flex flex-col md:flex-row bg-white rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.05)] overflow-hidden">
    
   
    <div class="w-full md:w-1/2 bg-[#0f172a] p-8 md:p-16 flex flex-col justify-center text-white relative">
      <div class="z-10 text-center md:text-left">
        <h1 class="text-[28px] md:text-[42px] font-bold mb-[10px] md:mb-[15px] leading-tight">
          Welcome back!
        </h1>
        <p class="text-[14px] md:text-[16px] text-slate-400 leading-relaxed">
          You can sign in to access with your existing account.
        </p>
      </div>

      <div class="absolute top-0 right-0 w-40 h-40 md:w-64 md:h-64 bg-indigo-500/10 rounded-full -mr-20 -mt-20 md:-mr-32 md:-mt-32"></div>
    </div>

    <div class="w-full md:w-1/2 p-6 sm:p-10 md:p-16 flex flex-col justify-center">
      
      <div class="mb-6 md:mb-10 text-center md:text-left">
        <h2 class="text-2xl md:text-3xl font-bold text-slate-900">Sign In</h2>
        <p class="text-slate-500 mt-2 text-sm md:text-base">
          Enter your account details below
        </p>
      </div>

      <form [formGroup]="loginform" (ngSubmit)="onLogin()" class="space-y-5 md:space-y-6">
        
        
        <div class="space-y-2">
          <label class="text-sm font-semibold text-slate-700">Username</label>
          <div class="relative ">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#6a5acd] transition-colors">
              <i class="bi bi-person text-lg"></i>
            </span>
            <input
              type="text"
              formControlName="userName"
              placeholder="Enter username"
              class="w-full h-11 md:h-12 pl-12 pr-4 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:border-[#6a5acd] focus:ring-4 focus:ring-indigo-600/5 transition-all text-sm md:text-base"
            />
          </div>
        </div>

        
        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <label class="text-sm font-semibold text-slate-700">Password</label>
          </div>
          <div class="relative group">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#6a5acd] transition-colors">
              <i class="bi bi-shield-lock text-lg"></i>
            </span>
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Enter password"
              class="w-full h-11 md:h-12 pl-12 pr-12 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:border-[#6a5acd] focus:ring-4 focus:ring-indigo-600/5 transition-all text-sm md:text-base"
            />
            <button 
              type="button"
              (click)="togglePassword()"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-[#6a5acd] transition-colors">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </div>

        
        <div class="flex items-center space-x-2">
          <input 
            type="checkbox" 
            id="remember" 
            class="w-4 h-4 rounded border-slate-300 text-[#6a5acd] focus:ring-[#6757cc] cursor-pointer"
          />
          <label 
            for="remember" 
            class="text-sm font-medium text-slate-600 cursor-pointer hover:text-slate-900"
          >
            Remember me
          </label>
        </div>

        
        <div class="pt-2 md:pt-4">
          <app-custom-button
            label="Continue"
            btnClass="w-full h-12 md:h-14 !rounded-xl bg-[#0f172a] hover:bg-[#1e293b] text-white font-bold text-base md:text-lg shadow-xl shadow-indigo-100 transition-all active:scale-[0.98]"
            (clicked)="onLogin()">
          </app-custom-button>
        </div>

      </form>
    </div>
  </div>
</div>
